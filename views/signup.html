<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - ShopHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="/">ShopHub</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group" id="otpGroup" style="display:none;">
                    <label for="otp">Enter OTP</label>
                    <div class="otp-input-group">
                        <input type="text" id="otp" name="otp" maxlength="6" placeholder="6-digit OTP">
                        <button type="button" id="resendOtpBtn" class="btn-secondary" style="display:none;">Resend OTP</button>
                    </div>
                    <div id="timerDisplay" class="timer"></div>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">Sign Up</button>
            </form>
            <p class="auth-link">Already have an account? <a href="/login.html">Login</a></p>
        </div>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
